[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "handfont-compiler"
version = "0.1.0"
description = "Local image and OpenType compiler for Handfont"
requires-python = ">=3.11"

[project.scripts]
handfont-compiler = "handfont_compiler.cli:main"

[tool.setuptools.packages.find]
where = ["."]
